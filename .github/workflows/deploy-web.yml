# Build the web app and publish it to Cloudflare Pages on every push to main.
#
# Needs two repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns the Pages project
#   CLOUDFLARE_API_TOKEN   a token with the "Cloudflare Pages: Edit" permission
# Without them the build still runs and the deploy step is skipped.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: pdfcraft-glass

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm-release
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin trunk
          trunk --version
      - name: Build the web app
        working-directory: apps/pdfcraft-web
        run: trunk build --release --cargo-profile wasm-release --dist ../../dist/web
      - name: Add hosting headers
        run: cp packaging/web/_headers dist/web/_headers
      - name: Check Cloudflare's 25 MiB per-file limit
        run: |
          ls -l dist/web
          too_big=$(find dist/web -type f -size +25M)
          if [ -n "$too_big" ]; then echo "Over 25 MiB: $too_big"; exit 1; fi
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          # The first deploy creates the project; later ones find it there.
          if ! npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy dist/web --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
