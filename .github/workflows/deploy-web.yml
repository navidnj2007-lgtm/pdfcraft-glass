# Build the web app on every push to main and publish the finished site to the `web` branch.
#
# Cloudflare Pages serves that branch through its GitHub integration (Workers & Pages ▸
# Connect to Git ▸ this repository, production branch `web`, no build command, output
# directory `/`). The Rust build runs here because it outlasts Cloudflare's build time limit.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm-release
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin trunk
          trunk --version
      - name: Build the web app
        working-directory: apps/pdfcraft-web
        run: trunk build --release --cargo-profile wasm-release --dist ../../dist/web
      - name: Add hosting headers
        run: cp packaging/web/_headers dist/web/_headers
      - name: Check Cloudflare's 25 MiB per-file limit
        run: |
          ls -l dist/web
          too_big=$(find dist/web -type f -size +25M)
          if [ -n "$too_big" ]; then echo "Over 25 MiB: $too_big"; exit 1; fi
      - name: Publish to the web branch
        working-directory: dist/web
        run: |
          # One commit, replaced each time: the branch holds only the current site.
          git init -q -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" web
